name: Local fixture checks and audit refresh

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run audit:refresh
      - run: npm run ci
      - run: npm run audit:verify

  publish-audit:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run audit:refresh
      - run: npm run ci
      - run: npm run audit:verify
      - name: Commit refreshed audit artifact and digest references
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/audit/necroops-fixture-mode-audit-log.json docs/DEVPOST_TRUTHFUL_REPLACEMENT.md docs/DEVPOST_UPDATE_COPY.md
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh verified fixture audit artifact"
            git push origin HEAD:main
          fi
